[project]
name = "gdelt-data-server"
version = "0.1.0"
description = "Aggregate-only GDELT ingestion, metrics and snapshot service"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
gdelt-server = "gdelt_server.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
gdelt_server = ["dashboard.html"]

[tool.setuptools.packages.find]
include = ["gdelt_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
